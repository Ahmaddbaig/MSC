name: Deploy itinerary with live road data

on:
  push:
    branches: [main]
    paths:
      - index.html
      - scripts/update-road-data.mjs
      - .github/workflows/deploy-pages.yml
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build site and refresh road data
        run: |
          mkdir -p site/data
          cp index.html site/index.html
          cp data/road-live.json site/data/road-live.json
          node scripts/update-road-data.mjs site/data/road-live.json || echo "::warning::Live APIs unavailable; deploying bundled road snapshot"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
